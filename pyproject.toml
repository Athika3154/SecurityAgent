[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-scanner"
version = "0.1.0"
description = "Thin Python layer over open-source secret and vulnerability scanners"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "Jinja2>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scanner = "scanner.cli:main"
scanner-web = "scanner.web:main"

[tool.setuptools]
packages = ["scanner", "scanner.runners"]

[tool.pytest.ini_options]
testpaths = ["tests"]
