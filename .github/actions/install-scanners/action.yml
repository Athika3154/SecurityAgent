name: Install scanners
description: Python dependencies plus pinned, checksum-verified Gitleaks and Trivy, and pinned Semgrep.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Install Python dependencies and Semgrep
      shell: bash
      env:
        SEMGREP_VERSION: "1.182.1"
      run: python -m pip install "PyYAML==6.0.2" "Jinja2==3.1.6" "semgrep==${SEMGREP_VERSION}"

    - name: Install Gitleaks (checksum verified)
      shell: bash
      env:
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      run: |
        tools="$RUNNER_TEMP/scanner-tools"
        mkdir -p "$tools"
        curl -sSfL --retry 3 -o "$tools/gitleaks.tar.gz" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  $tools/gitleaks.tar.gz" | sha256sum --check --status
        tar -xzf "$tools/gitleaks.tar.gz" -C "$tools" gitleaks
        echo "SCAN_GITLEAKS_BIN=$tools/gitleaks" >> "$GITHUB_ENV"

    - name: Install Trivy (checksum verified)
      shell: bash
      env:
        TRIVY_VERSION: "0.76.1"
        TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
      run: |
        tools="$RUNNER_TEMP/scanner-tools"
        mkdir -p "$tools"
        curl -sSfL --retry 3 -o "$tools/trivy.tar.gz" \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        echo "${TRIVY_SHA256}  $tools/trivy.tar.gz" | sha256sum --check --status
        tar -xzf "$tools/trivy.tar.gz" -C "$tools" trivy
        echo "SCAN_TRIVY_BIN=$tools/trivy" >> "$GITHUB_ENV"
