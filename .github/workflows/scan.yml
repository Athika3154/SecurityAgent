name: Secret scan

# pull_request (not pull_request_target): PR code never runs with write secrets.
on:
  pull_request:

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning
  pull-requests: write     # post the summary comment

concurrency:
  group: scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Scanner code and scan.yaml come from the BASE commit, so a PR cannot
      # change the scanner or weaken its own rules. To use a central scanner
      # repo instead, set `repository:` here and pin `ref:` to a commit SHA.
      - name: Check out scanner (base branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: tool
          persist-credentials: false

      - name: Check out PR (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.HEAD_SHA }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: python -m pip install "PyYAML==6.0.2" "Jinja2==3.1.6"

      - name: Install Gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
          echo "SCAN_GITLEAKS_BIN=$PWD/gitleaks" >> "$GITHUB_ENV"

      - name: Read scan.yaml from the base branch
        run: |
          # An empty file means defaults. Never fall back to the PR's copy.
          git -C target show "${BASE_SHA}:scan.yaml" > "$RUNNER_TEMP/scan.yaml" \
            || : > "$RUNNER_TEMP/scan.yaml"

      - name: Scan the PR's commits
        id: scan
        env:
          PYTHONPATH: ${{ github.workspace }}/tool
          SCAN_FP_SALT: ${{ secrets.SCAN_FP_SALT }}
        run: |
          mkdir scan-out
          python -m scanner.cli target \
            --config "$RUNNER_TEMP/scan.yaml" \
            --commit-range "${BASE_SHA}..${HEAD_SHA}" \
            --output scan-out/scan-report.json \
            --sarif scan-out/scan.sarif \
            --html scan-out/scan-report.html

      # hashFiles only sees the workspace, so reports live in scan-out/, not RUNNER_TEMP.
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('scan-out/scan.sarif') != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f  # v3.28.18
        with:
          sarif_file: scan-out/scan.sarif
          category: secret-scanner

      - name: Comment on the PR
        if: always() && hashFiles('scan-out/scan-report.json') != '' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true   # a comment failure must never change the scan result
        env:
          PYTHONPATH: ${{ github.workspace }}/tool
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scanner.pr_comment \
            --report scan-out/scan-report.json \
            --pr-number "${{ github.event.pull_request.number }}"

      - name: Upload HTML report
        if: always() && hashFiles('scan-out/scan-report.html') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: scan-report
          path: |
            scan-out/scan-report.html
            scan-out/scan-report.json
          retention-days: 14
