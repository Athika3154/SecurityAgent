name: Secret scan

# pull_request (not pull_request_target): PR code never runs with write secrets.
on:
  pull_request:

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning
  pull-requests: write     # post the summary comment

concurrency:
  group: scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Scanner code, scan.yaml and the baseline come from the BASE commit, so a PR
      # cannot change the scanner, weaken its rules or add its own findings to the
      # baseline. To use a central scanner repo instead, set `repository:` here and
      # pin `ref:` to a commit SHA.
      - name: Check out scanner (base branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: tool
          persist-credentials: false

      - name: Check out PR (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.HEAD_SHA }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Install scanners (pinned versions live in this action)
        uses: ./tool/.github/actions/install-scanners

      - name: Read scan.yaml and baseline from the base branch
        run: |
          # Empty file means defaults / no baseline. Never fall back to the PR's copy.
          git -C target show "${BASE_SHA}:scan.yaml" > "$RUNNER_TEMP/scan.yaml" \
            || : > "$RUNNER_TEMP/scan.yaml"
          git -C target show "${BASE_SHA}:.scan-baseline.json" > "$RUNNER_TEMP/baseline.json" \
            || : > "$RUNNER_TEMP/baseline.json"

      - name: Scan the PR's commits
        id: scan
        env:
          PYTHONPATH: ${{ github.workspace }}/tool
          SCAN_FP_SALT: ${{ secrets.SCAN_FP_SALT }}
        run: |
          mkdir scan-out
          args=()
          if [ -s "$RUNNER_TEMP/baseline.json" ]; then
            args+=(--baseline "$RUNNER_TEMP/baseline.json")
          fi
          python -m scanner.cli target \
            --config "$RUNNER_TEMP/scan.yaml" \
            --commit-range "${BASE_SHA}..${HEAD_SHA}" \
            --output scan-out/scan-report.json \
            --sarif scan-out/scan.sarif \
            --html scan-out/scan-report.html \
            "${args[@]}"

      # hashFiles only sees the workspace, so reports live in scan-out/, not RUNNER_TEMP.
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('scan-out/scan.sarif') != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f  # v3.28.18
        with:
          sarif_file: scan-out/scan.sarif
          category: secret-scanner

      - name: Comment on the PR
        if: always() && hashFiles('scan-out/scan-report.json') != '' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true   # a comment failure must never change the scan result
        env:
          PYTHONPATH: ${{ github.workspace }}/tool
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scanner.pr_comment \
            --report scan-out/scan-report.json \
            --pr-number "${{ github.event.pull_request.number }}"

      - name: Upload HTML report
        if: always() && hashFiles('scan-out/scan-report.html') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: scan-report
          path: |
            scan-out/scan-report.html
            scan-out/scan-report.json
          retention-days: 14
